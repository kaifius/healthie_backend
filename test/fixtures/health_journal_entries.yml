# created_at is explicit so ordering assertions are deterministic. The middle
# entry belongs to a different client than the outer two, so a provider-wide
# sort has to interleave across clients rather than group by client. The shared
# client writes to both of its providers, so a client's journal spans providers
# while each provider only sees the entries addressed to it.

